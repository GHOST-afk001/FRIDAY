name: Build Friday debug APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Friday debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare optional offline Hey Friday wake runtime
        shell: bash
        run: |
          set -euo pipefail
          VOICUTE_COMMIT="29727d350960b45015f57644b8d67058dc47a2e5"
          git clone --depth 1 https://github.com/voicute/onnx-wakeword.git /tmp/onnx-wakeword
          git -C /tmp/onnx-wakeword fetch --depth 1 origin "$VOICUTE_COMMIT"
          git -C /tmp/onnx-wakeword checkout --detach "$VOICUTE_COMMIT"
          mkdir -p app/src/main/java/com/voicute/wakeword app/src/main/assets
          cp /tmp/onnx-wakeword/android/app/src/main/java/com/voicute/wakeword/WakeWordEngine.java app/src/main/java/com/voicute/wakeword/
          MEL_FILE="$(find /tmp/onnx-wakeword/models -name 'melspectrogram.onnx' -print -quit)"
          WAKE_FILE="$(find /tmp/onnx-wakeword/models -name 'hey_friday.onnx' -print -quit)"
          test -n "$MEL_FILE"
          test -n "$WAKE_FILE"
          cp "$MEL_FILE" app/src/main/assets/melspectrogram.onnx
          cp "$WAKE_FILE" app/src/main/assets/hey_friday.onnx
          cat > app/src/main/assets/model_info.json <<'EOF'
          {
            "model_type": "multi_keyword",
            "keywords": ["Hey Friday"],
            "model_file": "hey_friday.onnx",
            "mel_time": 98,
            "cons_frames": 3,
            "n_mels": 32
          }
          EOF

      - name: Validate Gemini API secret and generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi

          model="gemini-3.6-flash"
          response_file="/tmp/gemini_response.json"
          max_attempts=5
          http_code=""
          quota_limited="false"

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Gemini smoke test attempt ${attempt}/${max_attempts}..."
            http_code="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -o "$response_file" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" \
              -d '{"contents":[{"parts":[{"text":"Reply with exactly: FRIDAY_GEMINI_OK"}]}],"generationConfig":{"thinkingConfig":{"thinkingLevel":"minimal"},"maxOutputTokens":256}}')"

            echo "Gemini HTTP status: ${http_code}"
            if [[ "$http_code" =~ ^2[0-9]{2}$ ]]; then
              break
            fi

            if [[ "$http_code" == "429" ]]; then
              quota_limited="true"
              if (( attempt < max_attempts )); then
                delay=$((attempt * 3))
                echo "Gemini quota/rate limit returned HTTP 429; retrying in ${delay}s..."
                sleep "$delay"
                continue
              fi
              echo "WARNING: Gemini generation smoke test is quota-limited. Build validation will continue; this does not change runtime Gemini behavior."
              break
            fi

            if [[ "$http_code" == "500" || "$http_code" == "502" || "$http_code" == "503" || "$http_code" == "504" ]]; then
              if (( attempt < max_attempts )); then
                delay=$((attempt * 3))
                echo "Gemini returned transient HTTP ${http_code}; retrying in ${delay}s..."
                sleep "$delay"
                continue
              fi
            fi

            echo "Gemini generateContent failed with HTTP ${http_code}. Exact sanitized API error:"
            python3 - "$response_file" <<'PY'
          import json, sys
          path = sys.argv[1]
          try:
              data = json.load(open(path, encoding="utf-8"))
              error = data.get("error", {})
              print(json.dumps({
                  "code": error.get("code"),
                  "status": error.get("status"),
                  "message": error.get("message")
              }, ensure_ascii=False))
          except Exception as exc:
              print(f"Unable to parse Gemini error response: {exc}")
          PY
            exit 1
          done

          if [[ "$quota_limited" == "true" ]]; then
            exit 0
          fi

          echo "Gemini JSON response validation:"
          python3 - "$response_file" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          candidates = data.get("candidates") or []
          if not candidates:
              raise SystemExit("Gemini returned no candidates.")

          candidate = candidates[0]
          finish_reason = candidate.get("finishReason", "unknown")
          parts = (candidate.get("content") or {}).get("parts") or []
          text_parts = [
              part.get("text", "").strip()
              for part in parts
              if isinstance(part.get("text"), str) and part.get("text", "").strip()
          ]
          text = "\n".join(text_parts).strip()

          print(json.dumps({
              "candidate_count": len(candidates),
              "finish_reason": finish_reason,
              "text_present": bool(text),
              "text_length": len(text)
          }, ensure_ascii=False))

          if not text:
              raise SystemExit("Gemini returned an empty text response.")

          print(f"Gemini API authentication and generation check passed for {data.get('modelVersion', 'requested model') }.")
          PY

      - name: Run command processor tests
        run: ./gradlew --no-daemon test --tests com.friday.assistant.commands.FridayCommandProcessorTest

      - name: Run agent planning tests
        run: ./gradlew --no-daemon test --tests com.friday.assistant.core.AgentToolPlannerTest --tests com.friday.assistant.core.UltronCoreTest

      - name: Run security tests
        run: ./gradlew --no-daemon test --tests com.friday.assistant.security.ActionPolicyValidatorTest --tests com.friday.assistant.security.SecurityBaselineTest

      - name: Run complete unit test suite
        run: ./gradlew --no-daemon test

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: friday-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
