name: Build FRIDAY 2 debug APK

on: [push, workflow_dispatch]

jobs:
  build-debug-apk:
    name: Build FRIDAY 2 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Android-only source
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -type f \( -name '*.py' -o -name 'requirements.txt' \) -print | grep -q .; then
            echo 'FRIDAY 2 must remain Android-only; Python source was found.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ""
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare Hey Friday wake runtime
        shell: bash
        run: |
          set -euo pipefail
          VOICUTE_COMMIT="29727d350960b45015f57644b8d67058dc47a2e5"
          git clone https://github.com/voicute/onnx-wakeword.git /tmp/onnx-wakeword
          git -C /tmp/onnx-wakeword checkout --detach "$VOICUTE_COMMIT"
          mkdir -p app/src/main/java/com/voicute/wakeword app/src/main/assets
          cp /tmp/onnx-wakeword/android/app/src/main/java/com/voicute/wakeword/WakeWordEngine.java app/src/main/java/com/voicute/wakeword/
          MEL_FILE="$(find /tmp/onnx-wakeword/models -name 'melspectrogram.onnx' -print -quit)"
          WAKE_FILE="$(find /tmp/onnx-wakeword/models -name 'hey_friday.onnx' -print -quit)"
          test -n "$MEL_FILE"
          test -n "$WAKE_FILE"
          cp "$MEL_FILE" app/src/main/assets/melspectrogram.onnx
          cp "$WAKE_FILE" app/src/main/assets/hey_friday.onnx
          printf '%s\n' '{"model_type":"multi_keyword","keywords":["Hey Friday"],"model_file":"hey_friday.onnx","mel_time":98,"cons_frames":3,"n_mels":32}' > app/src/main/assets/model_info.json

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Unit-test attempt $attempt/3"
            if ./gradlew --no-daemon :app:testDebugUnitTest; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((30 * attempt)); fi
          done
          exit 1

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Lint attempt $attempt/3"
            if ./gradlew --no-daemon :app:lintDebug; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((30 * attempt)); fi
          done
          exit 1

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "APK build attempt $attempt/3"
            if ./gradlew --no-daemon :app:assembleDebug; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((30 * attempt)); fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: friday-2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
