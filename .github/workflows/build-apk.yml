name: Build Friday debug APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Friday debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare optional offline Hey Friday wake runtime
        shell: bash
        run: |
          set -euo pipefail
          VOICUTE_COMMIT="29727d350960b45015f57644b8d67058dc47a2e5"
          git clone --depth 1 https://github.com/voicute/onnx-wakeword.git /tmp/onnx-wakeword
          git -C /tmp/onnx-wakeword fetch --depth 1 origin "$VOICUTE_COMMIT"
          git -C /tmp/onnx-wakeword checkout --detach "$VOICUTE_COMMIT"
          mkdir -p app/src/main/java/com/voicute/wakeword app/src/main/assets
          cp /tmp/onnx-wakeword/android/app/src/main/java/com/voicute/wakeword/WakeWordEngine.java app/src/main/java/com/voicute/wakeword/
          MEL_FILE="$(find /tmp/onnx-wakeword/models -name 'melspectrogram.onnx' -print -quit)"
          WAKE_FILE="$(find /tmp/onnx-wakeword/models -name 'hey_friday.onnx' -print -quit)"
          test -n "$MEL_FILE"; test -n "$WAKE_FILE"
          cp "$MEL_FILE" app/src/main/assets/melspectrogram.onnx
          cp "$WAKE_FILE" app/src/main/assets/hey_friday.onnx
          cat > app/src/main/assets/model_info.json <<'EOF'
          {"model_type":"multi_keyword","keywords":["Hey Friday"],"model_file":"hey_friday.onnx","mel_time":98,"cons_frames":3,"n_mels":32}
          EOF
      - name: Validate Gemini API secret and generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          model="gemini-3.6-flash"
          response_file="/tmp/gemini_response.json"
          max_attempts=5
          quota_limited="false"
          for attempt in $(seq 1 "$max_attempts"); do
            http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o "$response_file" -w '%{http_code}' -H "Content-Type: application/json" -H "x-goog-api-key: ${GEMINI_API_KEY}" -X POST "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" -d '{"contents":[{"parts":[{"text":"Reply with exactly: FRIDAY_GEMINI_OK"}]}],"generationConfig":{"thinkingConfig":{"thinkingLevel":"minimal"},"maxOutputTokens":256}}')"
            echo "Gemini HTTP status: ${http_code}"
            if [[ "$http_code" =~ ^2[0-9]{2}$ ]]; then break; fi
            if [[ "$http_code" == "429" ]]; then
              quota_limited="true"
              if (( attempt < max_attempts )); then sleep $((attempt * 3)); continue; fi
              break
            fi
            if [[ "$http_code" == "500" || "$http_code" == "502" || "$http_code" == "503" || "$http_code" == "504" ]] && (( attempt < max_attempts )); then
              sleep $((attempt * 3)); continue
            fi
            python3 - "$response_file" <<'PY'
import json,sys
data=json.load(open(sys.argv[1],encoding='utf-8'))
err=data.get('error',{})
print(json.dumps({'code':err.get('code'),'status':err.get('status'),'message':err.get('message')}))
raise SystemExit(1)
PY
          done
          if [[ "$quota_limited" == "true" ]]; then
            echo "Gemini quota is currently rate-limited (429); secret wiring remains validated and code build will continue."
            exit 0
          fi
          python3 - "$response_file" <<'PY'
import json,sys
data=json.load(open(sys.argv[1],encoding='utf-8'))
c=data.get('candidates') or []
if not c: raise SystemExit('Gemini returned no candidates')
parts=(c[0].get('content') or {}).get('parts') or []
text='\n'.join(p.get('text','').strip() for p in parts if isinstance(p.get('text'),str) and p.get('text','').strip()).strip()
if not text: raise SystemExit('Gemini returned empty text')
print('Gemini API authentication and generation check passed.')
PY
      - name: Run complete unit test suite
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: friday-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
